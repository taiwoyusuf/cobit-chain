<h1>Action Eligibility Rule Model</h1>
<p>Shows whether the requested action is eligible for admissibility evaluation before the engine decides whether it may proceed.</p>
<p>Eligibility asks whether the action can be evaluated. Admissibility asks whether the action can proceed.</p>
