name: Azure MCP Gateway R1 CI

on:
  pull_request:
    paths:
      - "infra/azure-mcp-gateway/**"
      - ".github/workflows/azure-mcp-gateway-r1-ci.yml"
  push:
    branches:
      - "feature/azure-mcp-gateway-r1"
    paths:
      - "infra/azure-mcp-gateway/**"
      - ".github/workflows/azure-mcp-gateway-r1-ci.yml"

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure-mcp-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile gateway Python
        run: python -m compileall -q app tests

      - name: Run R1 policy tests
        run: python -m pytest -q
