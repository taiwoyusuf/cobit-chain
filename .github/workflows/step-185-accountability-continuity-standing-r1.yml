name: Step 185 Accountability Continuity Standing R1 Candidate

on:
  push:
    branches:
      - candidate/step-185-accountability-continuity-standing-r1
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_185_accountability_continuity_standing_r1/**'
      - '.github/workflows/step-185-accountability-continuity-standing-r1.yml'
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_185_accountability_continuity_standing_r1/**'
      - '.github/workflows/step-185-accountability-continuity-standing-r1.yml'

jobs:
  candidate-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Step 185 candidate
        run: |
          python -m py_compile \
            platform_b1_mvp2/assurance_os/implementation/step_185_accountability_continuity_standing_r1/accountability_continuity_standing.py \
            platform_b1_mvp2/assurance_os/implementation/step_185_accountability_continuity_standing_r1/test_accountability_continuity_standing.py
      - name: Run Step 185 45-test hardened candidate regression suite
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_185_accountability_continuity_standing_r1
        run: python -m unittest -v test_accountability_continuity_standing.py
