name: Step 177 Service Lane Domain Profile

on:
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_177_service_lane_domain_profile_r1/**'
      - '.github/workflows/step177-service-lane-domain-profile.yml'
  push:
    branches:
      - feature/service-lane-domain-profile-r1
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_177_service_lane_domain_profile_r1/**'
      - '.github/workflows/step177-service-lane-domain-profile.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_177_service_lane_domain_profile_r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest -v test_service_lane_policy.py
