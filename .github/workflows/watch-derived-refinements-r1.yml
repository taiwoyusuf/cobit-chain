name: Watch-Derived Assurance Refinements R1

on:
  push:
    branches:
      - feature/watch-derived-assurance-refinements-r1
    paths:
      - 'platform_b1_mvp2/assurance_os/research/watch_derived_refinements_r1/**'
      - 'platform_b1_mvp2/assurance_os/implementation/step_177_service_lane_domain_profile_r1/domain_profile_update_map.json'
      - 'platform_b1_mvp2/assurance_os/implementation/step_183_recovery_reclosure_r1/**'
      - '.github/workflows/watch-derived-refinements-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Step 177 domain map JSON
        run: |
          python -m json.tool platform_b1_mvp2/assurance_os/implementation/step_177_service_lane_domain_profile_r1/domain_profile_update_map.json >/dev/null

      - name: Run watch-derived research tests
        working-directory: platform_b1_mvp2/assurance_os/research/watch_derived_refinements_r1
        run: python -m unittest discover -v -p 'test_*.py'

      - name: Run Step 183 recovery re-closure tests
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_183_recovery_reclosure_r1
        run: python -m unittest discover -v -p 'test_*.py'
