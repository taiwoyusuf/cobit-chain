name: Step 187 Accountability Continuity Commit-Time Revalidation R1 Candidate

on:
  push:
    branches:
      - candidate/step-187-accountability-continuity-commit-time-revalidation-r1
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1/**'
      - '.github/workflows/step-187-accountability-continuity-commit-time-revalidation-r1.yml'
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1/**'
      - '.github/workflows/step-187-accountability-continuity-commit-time-revalidation-r1.yml'

jobs:
  candidate-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Step 187 candidate
        run: |
          python -m py_compile \
            platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1/accountability_commit_time_revalidation.py \
            platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1/test_accountability_commit_time_revalidation.py \
            platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1/test_static_hardening.py
      - name: Run Step 187 34-test hardened candidate regression suite
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_187_accountability_continuity_commit_time_revalidation_r1
        run: python -m unittest -v test_accountability_commit_time_revalidation.py test_static_hardening.py
