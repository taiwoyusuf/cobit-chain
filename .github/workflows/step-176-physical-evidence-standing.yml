name: Step 176 Physical Evidence Standing

on:
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_176_physical_evidence_standing_r2/**'
      - '.github/workflows/step-176-physical-evidence-standing.yml'
  push:
    branches: [main]
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_176_physical_evidence_standing_r2/**'
      - '.github/workflows/step-176-physical-evidence-standing.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_176_physical_evidence_standing_r2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest -v test_physical_evidence_standing.py
