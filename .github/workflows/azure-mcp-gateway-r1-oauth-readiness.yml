name: Azure MCP Gateway R1 OAuth Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/azure-mcp-gateway-r1-oauth-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pr-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify readiness workflow is read-only
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/azure-mcp-gateway-r1-oauth-readiness.yml
          while IFS= read -r line; do
            command="$(echo "$line" | sed -E 's/^[[:space:]]+//')"
            case "$command" in
              "az account show "*|"az ad app show "*|"az ad sp show "*) ;;
              *)
                echo "Forbidden Azure command in readiness workflow: $command"
                exit 1
                ;;
            esac
          done < <(grep -E '^[[:space:]]+az ' "$workflow")
          if grep -Eiq 'az ad app (create|update|delete)|az ad sp (create|update|delete)|az containerapp (create|update|delete)|az role assignment|client-secret|password|credential|listkeys|listsecrets' "$workflow"; then
            echo "STOP: readiness workflow contains a mutation or credential operation"
            exit 1
          fi
          echo "PASS: OAuth readiness workflow is read-only"

  inspect-entra:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      OAUTH_CLIENT_ID: 1054f42d-2133-42f3-a024-a1ea065e8b53
      OAUTH_TENANT_ID: f8683fda-4956-4620-9e26-a1a14bbec914
      MCP_RESOURCE_APP_ID: 22bfbae3-f4e7-485f-be43-8cee15065084
      MCP_SCOPE_VALUE: MCP.Access
      MCP_SCOPE: api://22bfbae3-f4e7-485f-be43-8cee15065084/MCP.Access
      CALLBACK_URI: https://ca-cobitchain-gateway-r1.redcliff-45b94d4c.eastus2.azurecontainerapps.io/oauth/callback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with existing repository OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A2FC8A5E8F61495A9CB4ACB0B58E28AD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D884FA39892D4344B62F0349686E8CFC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EC26792611F64D18BB153A5D6855C23F }}

      - name: Capture read-only Entra application metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          az account show \
            --query '{tenantId:tenantId,subscriptionName:name,state:state}' \
            -o json > evidence/account.json

          az ad app show \
            --id "$OAUTH_CLIENT_ID" \
            --query '{id:id,appId:appId,displayName:displayName,signInAudience:signInAudience,isFallbackPublicClient:isFallbackPublicClient,publicClient:publicClient,spa:spa,web:web,requiredResourceAccess:requiredResourceAccess}' \
            -o json > evidence/client-app.json

          az ad sp show \
            --id "$MCP_RESOURCE_APP_ID" \
            --query '{appId:appId,displayName:displayName,oauth2PermissionScopes:oauth2PermissionScopes[?value==`MCP.Access`].{id:id,value:value,isEnabled:isEnabled,type:type,adminConsentDisplayName:adminConsentDisplayName,userConsentDisplayName:userConsentDisplayName}}' \
            -o json > evidence/mcp-resource-sp.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          account = json.loads(Path('evidence/account.json').read_text())
          app = json.loads(Path('evidence/client-app.json').read_text())
          resource = json.loads(Path('evidence/mcp-resource-sp.json').read_text())

          callback = os.environ['CALLBACK_URI']
          resource_app_id = os.environ['MCP_RESOURCE_APP_ID']
          scope_entries = resource.get('oauth2PermissionScopes') or []
          scope_id = scope_entries[0].get('id') if scope_entries else None

          public_uris = (app.get('publicClient') or {}).get('redirectUris') or []
          spa_uris = (app.get('spa') or {}).get('redirectUris') or []
          web_uris = (app.get('web') or {}).get('redirectUris') or []

          required = app.get('requiredResourceAccess') or []
          declared = False
          if scope_id:
              for item in required:
                  if item.get('resourceAppId') == resource_app_id:
                      for access in item.get('resourceAccess') or []:
                          if access.get('id') == scope_id and access.get('type') == 'Scope':
                              declared = True

          summary = {
              'schema': 'cobit-chain.azure-mcp-gateway.oauth-readiness.r1',
              'tenant_matches_expected': account.get('tenantId') == os.environ['OAUTH_TENANT_ID'],
              'client_app_id': app.get('appId'),
              'client_display_name': app.get('displayName'),
              'sign_in_audience': app.get('signInAudience'),
              'is_fallback_public_client': app.get('isFallbackPublicClient'),
              'public_client_redirect_uris': public_uris,
              'spa_redirect_uris': spa_uris,
              'web_redirect_uris': web_uris,
              'callback_already_registered_as_public_client': callback in public_uris,
              'callback_already_registered_as_spa': callback in spa_uris,
              'callback_already_registered_as_web': callback in web_uris,
              'mcp_scope': os.environ['MCP_SCOPE'],
              'mcp_scope_permission_id': scope_id,
              'mcp_scope_enabled': bool(scope_entries and scope_entries[0].get('isEnabled')),
              'mcp_scope_declared_on_client': declared,
              'azure_mutation_performed': False,
              'entra_mutation_performed': False,
              'credential_or_secret_retrieved': False,
          }
          Path('evidence/summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload OAuth readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: azure-mcp-gateway-r1-oauth-readiness
          path: evidence/
          if-no-files-found: error
          retention-days: 7
