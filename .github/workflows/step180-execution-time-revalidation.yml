name: Step 180 Execution-Time Revalidation

on:
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_180_execution_time_revalidation_r1/**'
      - 'platform_b1_mvp2/assurance_os/implementation/step_179_boundary_enforcement_nonbypass_r1/**'
      - '.github/workflows/step180-execution-time-revalidation.yml'
  push:
    branches:
      - main
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_180_execution_time_revalidation_r1/**'
      - 'platform_b1_mvp2/assurance_os/implementation/step_179_boundary_enforcement_nonbypass_r1/**'
      - '.github/workflows/step180-execution-time-revalidation.yml'

permissions:
  contents: read

jobs:
  deterministic-revalidation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_180_execution_time_revalidation_r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Step 180 deterministic revalidation tests
        run: python -m unittest -v test_revalidation.py
