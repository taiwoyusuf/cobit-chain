name: Step 186 Accountability Continuity Boundary Non-Bypass R1 Candidate

on:
  push:
    branches:
      - candidate/step-186-accountability-continuity-boundary-nonbypass-r1
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_186_accountability_continuity_boundary_nonbypass_r1/**'
      - '.github/workflows/step-186-accountability-continuity-boundary-nonbypass-r1.yml'
  pull_request:
    paths:
      - 'platform_b1_mvp2/assurance_os/implementation/step_186_accountability_continuity_boundary_nonbypass_r1/**'
      - '.github/workflows/step-186-accountability-continuity-boundary-nonbypass-r1.yml'

jobs:
  candidate-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Step 186 candidate
        run: |
          python -m py_compile \
            platform_b1_mvp2/assurance_os/implementation/step_186_accountability_continuity_boundary_nonbypass_r1/accountability_boundary_nonbypass.py \
            platform_b1_mvp2/assurance_os/implementation/step_186_accountability_continuity_boundary_nonbypass_r1/test_accountability_boundary_nonbypass.py
      - name: Run Step 186 21-test candidate regression suite
        working-directory: platform_b1_mvp2/assurance_os/implementation/step_186_accountability_continuity_boundary_nonbypass_r1
        run: python -m unittest -v test_accountability_boundary_nonbypass.py
